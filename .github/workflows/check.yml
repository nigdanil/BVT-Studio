name: source-checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy==2.2.6 Pillow==12.3.0 openpyxl==3.1.5 jsonschema==4.26.0
      - name: Validate bundled examples
        run: python scripts/validate_examples.py
      - name: Static and numerical tests
        run: python -m unittest discover -s tests -v
      - name: Build Blender addon ZIP
        run: python scripts/build_addon.py
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BVT_Studio_Blender_Addon
          path: dist/BVT_Studio_Blender_Addon_*.zip
          if-no-files-found: error
