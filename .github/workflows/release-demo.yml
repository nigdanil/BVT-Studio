name: demo-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, e.g. v0.4.0-alpha.5-demo.1'
        required: true
        type: string
      blender_url:
        description: 'Official Blender 5.2.3 Linux x64 tar.xz URL (download.blender.org)'
        required: true
        type: string
      blender_sha256:
        description: 'Official SHA-256 of the Blender archive'
        required: true
        type: string
      assets_approved:
        description: 'I have permission to redistribute the included example assets'
        required: true
        type: boolean
        default: false
      create_draft:
        description: 'Create a draft prerelease after a successful build'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.assets_approved && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install numpy==2.2.6 Pillow==12.3.0
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon0 libxi6 libxrender1
      - name: Obtain verified Blender
        env:
          BLENDER_URL: ${{ inputs.blender_url }}
          BLENDER_SHA256: ${{ inputs.blender_sha256 }}
        run: |
          python - <<'PY'
          import os, re, urllib.parse
          url=os.environ['BLENDER_URL']; sha=os.environ['BLENDER_SHA256']
          u=urllib.parse.urlsplit(url)
          if not (u.scheme=='https' and u.netloc=='download.blender.org' and u.path.endswith('.tar.xz') and re.fullmatch('[a-fA-F0-9]{64}',sha)):
              raise SystemExit('Use official Blender tar.xz URL and checksum')
          PY
          curl --fail --location --proto '=https' --retry 2 "$BLENDER_URL" -o "$RUNNER_TEMP/blender.tar.xz"
          printf '%s  %s\n' "$BLENDER_SHA256" "$RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']); out=tmp/'blender-dist'; out.mkdir()
          with tarfile.open(tmp/'blender.tar.xz') as t: t.extractall(out,filter='data')
          candidates=list(out.glob('*/blender'))
          if len(candidates)!=1: raise SystemExit('Expected one Blender executable')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('BVT_BLENDER='+str(candidates[0])+'\n')
          PY
      - name: Build and verify all demo scenes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python scripts/build_release.py --version "$RELEASE_VERSION" --blender "$BVT_BLENDER"
      - uses: actions/upload-artifact@v4
        with:
          name: bvt-demo-release
          path: dist/releases/${{ inputs.version }}/*
          if-no-files-found: error
          compression-level: 0
  draft:
    needs: build
    if: ${{ inputs.create_draft && inputs.assets_approved && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bvt-demo-release
          path: release-files
      - name: Check manifest and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd release-files
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json, os, pathlib
          m=json.loads(pathlib.Path('release_manifest.json').read_text())
          if m['version']!=os.environ['RELEASE_VERSION'] or m['commit']!=os.environ['GITHUB_SHA'] or m['scenes_rendered']!=13 or m['scenes_reopened']!=13 or m['water_null_pass']!=7:
              raise SystemExit('Wrong release version, commit or QA status')
          PY
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing overwrite'; exit 1
          fi
          gh release create "$RELEASE_VERSION" ./*.zip release_manifest.json SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "BVT Studio $RELEASE_VERSION" \
            --notes 'Experimental synthetic demo. 13 packed Blender scenes; seven calibrated water modes. No real-data or YOLO accuracy validation.'
